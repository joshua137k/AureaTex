<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/static/theme.js"></script>
  <script src="/static/dialog.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AureaTeX - Invite</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">

  <style>
    :root { --red: #E03030; --black: #111111; --white: #FFFFFF; --shadow: 4px 4px 0 #111; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Space Grotesk', sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: var(--white); border: 3px solid var(--black); box-shadow: var(--shadow); padding: 2.5rem; max-width: 400px; width: 90%; text-align: center; }
    .card h1 { font-size: 1.5rem; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
    .card p { font-size: 0.9rem; color: #555; margin-bottom: 1.5rem; line-height: 1.5; }
    .project-box { background: #FFE8E8; border: 2px dashed var(--red); padding: 1rem; margin-bottom: 1.5rem; font-weight: 700; color: var(--red); word-break: break-all; }
    .btn { padding: 0.6rem 1rem; border: 3px solid var(--black); font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: block; width: 100%; transition: transform 0.1s, box-shadow 0.1s; text-decoration: none; text-align: center; }
    .btn:hover { transform: translate(2px, 2px); box-shadow: none; }
    .btn-red { background: var(--red); color: var(--white); }
    :root[data-theme="dark"] { --red: #f05252; --black: #e5e9f0; --white: #1c2029; --shadow: 4px 4px 0 #000; }
    :root[data-theme="dark"] body { background: #111318; color: var(--black); }
    :root[data-theme="dark"] .card { border-color: #3a4252; }
    :root[data-theme="dark"] .card p { color: #9aa5b8; }
    :root[data-theme="dark"] .project-box { background: rgba(240, 82, 82, .14); }
    :root[data-theme="dark"] #pOwner { color: var(--black) !important; }
    :root[data-theme="dark"] .btn { border-color: #3a4252; }
    :root[data-theme="dark"] .btn-red { color: #fff; }
  </style>
</head>
<body>

  <div class="card" id="inviteCard" style="display:none;">
    <h1>Collaboration Invite</h1>
    <p>You've been invited to collaborate on an AureaTeX project.</p>
    
    <div class="project-box">
      <div id="pName" style="font-size: 1.2rem; margin-bottom: 0.2rem;">Loading...</div>
      <div id="pOwner" style="font-size: 0.8rem; font-weight: 500; color: #111;">Owner: ---</div>
    </div>

    <button class="btn btn-red" onclick="acceptInvite()" id="btnAccept">Accept and Enter Project</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const inviteToken = urlParams.get('token');
    const userToken = localStorage.getItem('Joshuatex_token');

    if (!userToken) {
      // Depois do login o utilizador volta automaticamente a este convite.
      sessionStorage.setItem('aurea_next', window.location.pathname + window.location.search);
      window.location.href = '/app/login';
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (!inviteToken) {
        document.body.innerHTML = "<h2 style='text-align:center;'>Invalid Invite. Malformed link.</h2>";
        return;
      }

      try {
        const res = await fetch(`/api/invites/${encodeURIComponent(inviteToken)}`);
        if (!res.ok) throw new Error("Link expired or revoked by the owner.");
        
        const data = await res.json();
        
        document.getElementById('pName').textContent = data.project_name;
        document.getElementById('pOwner').textContent = `Owner: ${data.owner_name}`;
        document.getElementById('inviteCard').style.display = 'block';
      } catch (err) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<h1>Error</h1><p></p><a href="/app/projects" class="btn btn-red">Go to Projects</a>';
        card.querySelector('p').textContent = err.message;
        document.body.replaceChildren(card);
      }
    });

    async function acceptInvite() {
      const btn = document.getElementById('btnAccept');
      btn.textContent = "Accepting...";
      btn.disabled = true;

      try {
        const res = await fetch(`/api/invites/${encodeURIComponent(inviteToken)}/accept`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${userToken}` }
        });
        
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.detail || "Error accepting invite.");
        }
        
        const data = await res.json();
        

        window.location.href = `/app/editor?id=${Number(data.project_id)}`;
      } catch (err) {
        alert(err.message);
        btn.textContent = "Accept and Enter Project";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
